<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Bharathraj R</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.85);
            --neon-green: #00ff41;
            --text-white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 65, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 65, 0.05), transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-white);
            overflow: hidden;
        }

        /* --- CARD --- */
        .v-card {
            width: 340px;
            height: 620px;
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            transition: 0.3s;
        }

        /* --- PROFILE --- */
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .role {
            color: var(--neon-green);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        /* --- QR SECTION --- */
        .qr-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
            transition: transform 0.3s ease;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
        }

        .scan-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* --- TOGGLE BUTTONS --- */
        .tabs {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tab-btn.active {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .tab-btn:hover:not(.active) {
            color: white;
        }

        /* --- BOTTOM LINKS --- */
        .social-row {
            margin-top: auto;
            display: flex;
            gap: 20px;
        }
        .social-link {
            color: #ccc;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .social-link:hover { color: var(--neon-green); transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="v-card">
        
        <img src="images/profile .jpeg" alt="Profile" class="profile-img">
        <h1 class="name">Bharathraj R</h1>
        <p class="role">Biomedical | AI | Embedded</p>

        <div class="qr-container">
            <img id="qrImage" src="" alt="QR Code">
        </div>
        <p class="scan-text" id="qrLabel">Scanning...</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="updateQR('linkedin')">
                <i class="fab fa-linkedin"></i> LinkedIn
            </button>
            <button class="tab-btn" onclick="updateQR('github')">
                <i class="fab fa-github"></i> GitHub
            </button>
            <button class="tab-btn" onclick="updateQR('resume')">
                <i class="fas fa-file-alt"></i> Resume
            </button>
        </div>

        <div class="social-row">
            <a href="mailto:bharathraj2400@gmail.com" class="social-link"><i class="fas fa-envelope"></i></a>
            <a href="tel:+918754075731" class="social-link"><i class="fas fa-phone"></i></a>
            <a href="index.html" class="social-link"><i class="fas fa-globe"></i></a>
        </div>

    </div>

    <script>
        // --- YOUR DATA LINKS ---
        const links = {
            linkedin: "https://www.linkedin.com/in/bharathrajr2996",
            github:   "https://github.com/BHARATHRAJ-2996",
            
            // IMPORTANT: Replace this Google Drive link with your actual Resume Public Link
            resume:   "https://drive.google.com/file/d/1vhd7Hri_uPt32fgH3p04tY4xLObWA3Mw/view?usp=sharing" 
        };

        const qrImage = document.getElementById('qrImage');
        const qrLabel = document.getElementById('qrLabel');
        const buttons = document.querySelectorAll('.tab-btn');

        // Function to Generate QR
        function updateQR(type) {
            // Update Buttons Style
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Set Data
            let url = links[type];
            let labelText = "";

            if(type === 'linkedin') labelText = "Scan to Connect on LinkedIn";
            if(type === 'github') labelText = "Scan to View Projects";
            if(type === 'resume') labelText = "Scan to Download Resume";

            // Generate QR via API
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${url}`;
            qrLabel.innerText = labelText;
        }

        // Initialize with LinkedIn
        window.onload = function() {
            buttons[0].click();
        };
    </script>

</body>
</html>
